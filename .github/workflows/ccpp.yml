name: C/C++ CI

concurrency: 
  group: environment-${{ github.head_ref }}
  cancel-in-progress: true

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v3
    - name: apt
      run: sudo apt update && sudo apt install bison flex ninja-build lua5.3
    - name: make
      run: make

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: brew
      run: brew install ninja lua@5.4
    - name: make
      run: |
        make

  build-haiku:
    runs-on: 'ubuntu-latest'
    container: 'docker.io/hectorm/qemu-haiku:latest'
    steps:
      - name: startvm
        run: container-init & timeout 600 vmshell exit 0

      - name: pkgman
        run: 'vmshell pkgman install -y make'

      - name: checkout
        uses: 'actions/checkout@v3'

      - name: copy
        run: |
          vmshell mkdir ./src/
          tar -cf - ./ | vmshell tar -xf - -C ./src/

      - name: build
        run: vmshell make -C src

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        msystem: UCRT64
        install: >-
          make
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-lua
          mingw-w64-ucrt-x86_64-nsis
          ninja
          bison
          flex
          zip
          git
    - uses: actions/checkout@v3
    - name: build
      run: |
        make LDFLAGS="-s -static" CFLAGS="-g -Os"
    - name: package
      run: |
        make ack-setup.exe
    - name: upload setup
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}.${{ github.sha }}
        path: ack-setup.exe
