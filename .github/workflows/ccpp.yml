name: C/C++ CI

env:
  PYTHONPATH: ${{ github.workspace }}/.obj/python-deps

concurrency: 
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: apt
      run: sudo apt update && sudo apt install bison flex lua5.3 libconfig-dev pkg-config python3-pip
    - name: Python build dependencies
      run: python3 -m pip install --target .obj/python-deps libconf==2.0.1
    - name: make
      run: make
    - name: Description schema tests
      run: >-
        python3 util/ego/descr/test_schemachecker.py
        util/ego/descr/schemachecker.py
        .obj/util/ego/+i386_descr/i386.descr
        .obj/modules/src/em_data/+em_data_hdr/em_mnem.h
    - name: Description reader tests
      run: >-
        python3 util/ego/descr/test_readers.py
        .obj/staging/lib/ack/ego .obj/staging/share/ack/ego/*.descr

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: brew
      run: brew install python lua@5.4 coreutils make libconfig pkg-config
    - name: Python build dependencies
      run: python3 -m pip install --target .obj/python-deps libconf==2.0.1
    - name: make
      run: |
        gmake

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        update: true
        msystem: UCRT64
        install: >-
          make
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-libconfig
          mingw-w64-ucrt-x86_64-lua
          mingw-w64-ucrt-x86_64-nsis
          mingw-w64-ucrt-x86_64-pkg-config
          mingw-w64-ucrt-x86_64-python
          mingw-w64-ucrt-x86_64-python-pip
          bison
          flex
          zip
          git
          ninja
          diffutils
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: build
      run: |
        python3 -m pip install --target .obj/python-deps libconf==2.0.1
        make LDFLAGS="-s -static" ack-setup.exe AB_SANDBOX=no
    - name: upload setup
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}.${{ github.sha }}
        path: ack-setup.exe
