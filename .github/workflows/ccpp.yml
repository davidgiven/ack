name: C/C++ CI

concurrency: 
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: apt
      run: sudo apt update && sudo apt install bison flex lua5.3 libconfig-dev pkg-config
    - name: make
      run: make

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: brew
      run: brew install python lua@5.4 coreutils make libconfig pkg-config
    - name: make
      run: |
        gmake

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        update: true
        msystem: UCRT64
        install: >-
          make
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-libconfig
          mingw-w64-ucrt-x86_64-lua
          mingw-w64-ucrt-x86_64-nsis
          mingw-w64-ucrt-x86_64-pkg-config
          mingw-w64-ucrt-x86_64-python
          bison
          flex
          zip
          git
          ninja
          diffutils
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: build
      run: |
        make LDFLAGS="-s -static" ack-setup.exe AB_SANDBOX=no
    - name: upload setup
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event.repository.name }}.${{ github.sha }}
        path: ack-setup.exe
